<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measles cases in Pennsylvania by year</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
 * DATAWRAPPER-STYLE TYPOGRAPHY — applies to all visualizations/ embeds.
 * Font: Roboto (fallback Arial/sans-serif). Body/annotation/label text
 * capped at two sizes — 14px primary (near-black), 12px secondary (gray).
 * Regular weight for body text; bold reserved for titles and emphasis.
 * Sentence case throughout. See measles_scraper.R comments for source.
 */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: #fff; }

  #pg-measles-bar {
    margin: 0 auto;
    font-family: 'Roboto', Arial, sans-serif;
    padding: 16px 0 12px;
  }
  .pg-bar-hed {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 16px;
  }
  .pg-bar-source {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    line-height: 1.5;
  }
  .pg-bar-dot {
    font-size: 15px;
    vertical-align: -1px;
    margin: 0 1px;
  }
  #pg-bar-tip {
    display: none;
    position: fixed;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 8px 12px;
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 14px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    z-index: 100;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="pg-measles-bar">
  <h2 class="pg-bar-hed">Measles cases in Pennsylvania by year</h2>
  <div style="position:relative">
    <svg id="pg-bar-svg" style="width:100%;display:block"></svg>
  </div>
  <p class="pg-bar-source">Chart: Jimmy Cloutier / Post-Gazette <span class="pg-bar-dot">&bull;</span> Source: Pennsylvania Department of Health. Years with fewer than 5 cases shown as &lt;5.</p>
</div>

<div id="pg-bar-tip"></div>

<script>
(function () {
  /* SCRAPER-DATA-START */
  const totalCases = 460;
  /* SCRAPER-DATA-END */

  const barData = [
    { year: 2000, cases: 1,  lt5: true  }, { year: 2001, cases: 8,  lt5: false },
    { year: 2002, cases: 1,  lt5: true  }, { year: 2003, cases: 9,  lt5: false },
    { year: 2004, cases: 0,  lt5: false }, { year: 2005, cases: 0,  lt5: false },
    { year: 2006, cases: 2,  lt5: true  }, { year: 2007, cases: 3,  lt5: true  },
    { year: 2008, cases: 1,  lt5: true  }, { year: 2009, cases: 14, lt5: false },
    { year: 2010, cases: 2,  lt5: true  }, { year: 2011, cases: 13, lt5: false },
    { year: 2012, cases: 2,  lt5: true  }, { year: 2013, cases: 0,  lt5: false },
    { year: 2014, cases: 3,  lt5: true  }, { year: 2015, cases: 1,  lt5: true  },
    { year: 2016, cases: 0,  lt5: false }, { year: 2017, cases: 4,  lt5: true  },
    { year: 2018, cases: 2,  lt5: true  }, { year: 2019, cases: 17, lt5: false },
    { year: 2020, cases: 0,  lt5: false }, { year: 2021, cases: 0,  lt5: false },
    { year: 2022, cases: 0,  lt5: false }, { year: 2023, cases: 9,  lt5: false },
    { year: 2024, cases: 4,  lt5: true  }, { year: 2025, cases: 16, lt5: false },
    { year: 2026, cases: totalCases, lt5: false },
  ];

  const margin = { top: 20, right: 16, bottom: 28, left: 32 };
  const container = document.getElementById('pg-measles-bar');
  const svgEl = document.getElementById('pg-bar-svg');
  const tip = document.getElementById('pg-bar-tip');

  // Flips the tooltip to the left of the cursor when it would otherwise
  // overflow the right edge of the window — position:fixed is relative
  // to the iframe's own viewport when embedded, so an unclamped tooltip
  // gets clipped by the iframe boundary rather than wrapping visibly.
  function positionTip(event) {
    const tipWidth = tip.getBoundingClientRect().width;
    let left = event.clientX + 12;
    if (left + tipWidth > window.innerWidth - 4) {
      left = event.clientX - 12 - tipWidth;
    }
    tip.style.left = left + 'px';
    tip.style.top = (event.clientY - 10) + 'px';
  }

function draw() {
  // Re-measured on every draw (not just once at load) so the chart
  // redraws at true size on resize, instead of the browser uniformly
  // scaling a viewBox frozen at the load-time width — which is what
  // shrinks all the in-chart text when the window narrows afterward.
  const totalW = container.getBoundingClientRect().width || 640;
  const totalH = 220;
  const w = totalW - margin.left - margin.right;
  const h = totalH - margin.top - margin.bottom;

  const svg = d3.select(svgEl);
  svg.selectAll('*').remove();
  svg
    .attr('viewBox', `0 0 ${totalW} ${totalH}`)
    .attr('width', totalW)
    .attr('height', totalH);

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(barData.map(d => d.year)).range([0, w]).padding(0.2);
  const maxCases = d3.max(barData, d => d.cases);
  const y = d3.scaleLinear().domain([0, Math.ceil(maxCases * 1.15)]).range([h, 0]);

  // Grid lines + y-axis
  g.append('g').call(d3.axisLeft(y).ticks(4))
    .call(ax => ax.select('.domain').remove())
    .call(ax => ax.selectAll('line').attr('stroke', '#eee').attr('stroke-dasharray', '2,2').attr('x2', w))
    .call(ax => ax.selectAll('text').attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px').attr('fill', '#888'));

  // x-axis
  g.append('g').attr('transform', `translate(0,${h})`)
    .call(d3.axisBottom(x)
      .tickValues(barData.map(d => d.year).filter(yr => yr % 5 === 0))
      .tickSize(0).tickPadding(6))
    .call(ax => ax.select('.domain').attr('stroke', '#ccc'))
    .call(ax => ax.selectAll('text').attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px').attr('fill', '#888'));

  // Bars
  g.selectAll('.bar').data(barData.filter(d => d.cases > 0)).join('rect')
    .attr('x', d => x(d.year))
    .attr('y', d => y(d.cases))
    .attr('width', x.bandwidth())
    .attr('height', d => h - y(d.cases))
    .attr('fill', d => d.year === 2026 ? '#a93226' : '#e8a898')
    .attr('opacity', d => d.year === 2026 ? 1 : 0.6)
    .style('cursor', 'pointer')
    .on('mouseover', function (event, d) {
      const label = d.lt5 ? 'Fewer than 5 cases' : `${d.cases} case${d.cases !== 1 ? 's' : ''}`;
      tip.innerHTML = `<strong>${d.year}</strong><br>${label}`;
      tip.style.display = 'block';
      positionTip(event);
    })
    .on('mousemove', positionTip)
    .on('mouseout', function () {
      tip.style.display = 'none';
    });

  // 2026 label
  g.append('text')
    .attr('x', x(2026) + x.bandwidth() / 2)
    .attr('y', y(totalCases) - 5)
    .attr('text-anchor', 'middle')
    .attr('font-family', "'Roboto', Arial, sans-serif")
    .attr('font-size', '12px').attr('font-weight', '700').attr('fill', '#a93226')
    .text(totalCases);
}

// Tells the parent frame our true content height, in case it's set up
// to listen (e.g. an iframe-auto-resize script) — a harmless no-op
// otherwise. Without a listener on the host page, the iframe's height
// still has to be set manually to match.
function reportHeight() {
  if (window.parent !== window) {
    window.parent.postMessage(
      { type: 'pg-measles-embed-resize', height: container.getBoundingClientRect().height },
      '*'
    );
  }
}

draw();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 150);
});

// A ResizeObserver keeps the parent frame's height in sync with ANY
// change to the chart's actual size, not just a one-time report right
// after load — this covers timing races a single postMessage call
// misses, like a web font finishing its swap (and reflowing text)
// after the chart's first paint.
new ResizeObserver(reportHeight).observe(container);

// document.fonts.ready resolves once Roboto has actually finished loading
// and swapped in. ResizeObserver is supposed to catch the resulting
// text-reflow on its own, but that's an observed gap on some mobile
// WebKit versions specifically — confirmed in production as a mobile
// iframe getting stuck short, never growing to the post-font-swap height.
// This guarantees one more report fires exactly when it's needed, instead
// of hoping the observer or the timer below catches it.
if (window.document.fonts && window.document.fonts.ready) {
  window.document.fonts.ready.then(reportHeight);
}

// Belt-and-braces on top of the ResizeObserver: re-send the height on a
// plain timer for the first several seconds after load, the same way
// production embed libraries (Datawrapper's included) do — a backstop
// against any timing race regardless of its exact cause. 30 tries / 500ms
// = 15s, long enough to outlast a slow mobile connection's web font fetch.
let reportTries = 0;
const reportTimer = setInterval(() => {
  reportHeight();
  if (++reportTries >= 30) clearInterval(reportTimer);
}, 500);
})();
</script>
</body>
</html>
