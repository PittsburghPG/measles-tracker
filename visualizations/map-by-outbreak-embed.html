/*
 * DATAWRAPPER-STYLE TYPOGRAPHY — applies to all visualizations/ embeds.
 * Font: Roboto (fallback Arial/sans-serif). Body/annotation/label text
 * capped at two sizes — 14px primary (near-black), 12px secondary (gray).
 * Regular weight for body text; bold reserved for titles and emphasis.
 * Sentence case throughout. See measles_scraper.R comments for source.
 */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: 'Roboto', Arial, sans-serif;
  }

  .dw-chart {
    margin: 0 auto;
    padding: 16px 0 12px;
  }

  .dw-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    color: #1a1a1a;
    margin-bottom: 6px;
  }

  .dw-description {
    font-size: 14px;
    line-height: 1.5;
    color: #555;
    margin-bottom: 16px;
  }

  .dw-highlight {
    text-decoration-line: underline;
    text-decoration-color: #a93226;
    text-decoration-thickness: 3px;
    text-underline-offset: 5px;
  }

  .dw-legend {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: #555;
    align-items: center;
    margin-bottom: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-circle {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid #a93226;
    background: repeating-linear-gradient(135deg, transparent, transparent 2px, rgba(169,50,38,0.25) 2px, rgba(169,50,38,0.25) 3px), #f0ddd5;
    flex-shrink: 0;
  }

  .legend-circle.inactive {
    border-color: #999;
    background: repeating-linear-gradient(135deg, transparent, transparent 2px, rgba(120,120,120,0.4) 2px, rgba(120,120,120,0.4) 3px), #dedede;
  }

  #map-svg {
    width: 100%;
    display: block;
  }

  .dw-source {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    line-height: 1.4;
  }

  .dw-dot {
    font-size: 15px;
    vertical-align: -1px;
    margin: 0 1px;
  }

  .county          { fill: #efefef; stroke: #fff; stroke-width: 0.75px; }
  .county.affected { fill: url(#hatch-active); }
  .county.affected.inactive { fill: url(#hatch-inactive); }
  .county.transmission { fill: url(#hatch-transmission); stroke: #7a1a10; stroke-width: 1px; }
  .bubble          { stroke-width: 1px; fill-opacity: 0.12; cursor: pointer; transition: fill-opacity 0.1s; }
  .bubble.active   { fill: #a93226; stroke: #a93226; }
  .bubble.inactive { fill: #888; stroke: #888; }
  .bubble:hover    { fill-opacity: 0.45; }
  .bubble.dot      { fill: none; stroke-width: 1.25px; transition: stroke-width 0.1s; }
  .bubble.dot:hover{ stroke-width: 2.5px; }

  #tooltip {
    position: fixed;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 9px 12px;
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 14px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    display: none;
    z-index: 100;
  }
  #tooltip .tt-county { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  #tooltip .tt-outbreak { font-size: 12px; color: #888; margin-bottom: 2px; }
  #tooltip .tt-cases { color: #333; }
  .county-label    { font-family: 'Roboto', Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #222; pointer-events: none; }
  .case-count-label{ pointer-events: none; }
  .city-dot        { fill: #555; stroke: #fff; stroke-width: 1px; }
  .city-label      { font-family: 'Roboto', Arial, sans-serif; font-size: 12px; fill: #444; pointer-events: none; }

// overflow the right edge of the window — position:fixed is relative to
// the iframe's own viewport when embedded, so an unclamped tooltip gets
// clipped by the iframe boundary rather than wrapping visibly.

-79.91771827118271,39.721124132531315]],[[-76.81297896728967,41.59043801927019],[-76.22074545845459,41.541471616906165]],[[-80.52071966199662,39.96251990558905],[-80.52071966199662,40.15924457473574],[-80.51713036800368,40.39978128810287],[-80.52071966199662,40.4770966602566]],[[-79.87105744927449,40.19704320112201],[-79.84952168531684,40.174707649166486],[-79.90336109521095,40.152372097210964],[-79.87823603726036,40.12660030649306]],[[-78.91989454114541,41.99849137230372],[-78.20562503655036,41.999350431994316]],[[-75.52801171781718,40.44702957108571],[-75.69670853548536,40.24171430503304]],[[-77.13601542665427,40.06990236691366],[-77.0678188407884,40.028667501765014],[-77.01756872488724,40.01406348702486],[-76.96731860898609,39.93502999548995],[-76.98526507895079,39.893795130341296],[-76.95655072700727,39.85685556364563],[-76.99962225492254,39.83108377292772],[-76.99962225492254,39.720265072840725]],[[-76.99962225492254,39.720265072840725],[-77.45905188601886,39.720265072840725]],[[-77.45905188601886,39.720265072840725],[-77.46981976799768,39.944479652086514]],[[-76.85963978919789,40.2262512306023],[-76.75555026340263,40.17728482823828],[-76.72324661746617,40.11972782896828]],[[-76.23869192841929,39.72198319222191],[-76.99962225492254,39.720265072840725]],[[-77.70312387753877,40.263190797297966],[-77.72465964149642,40.25030490193901],[-77.79644552135521,40.166976111951115],[-77.86464210722107,40.06131177000769]],[[-76.92783637506375,42.0019276110661],[-76.14537028460285,41.99849137230372]],[[-77.45905188601886,39.720265072840725],[-78.09794621676217,39.72284225191251]]]};

let paCounties = null;

// VIEW_W is re-measured inside render() (not hoisted to a one-time
// constant) so the map — and every label size inside it — redraws at
// true scale instead of the browser uniformly shrinking a viewBox frozen
// at the load-time width.
function render() {
  const VIEW_W = document.querySelector('.dw-chart').getBoundingClientRect().width || 680;

  // Fills the canvas width edge-to-edge with NO distortion — a single
  // uniform scale factor (k) is used for both x and y, so true state
  // proportions are preserved. The canvas height then isn't fixed in
  // advance; it's computed below from however tall the state turns out
  // to be at that scale, so there's no leftover top/bottom margin either.
  const raw = d3.geoMercator().scale(1).translate([0, 0]);
  const rawPath = d3.geoPath().projection(raw);
  const [[x0, y0], [x1, y1]] = rawPath.bounds(paCounties);

  const padLeft = 4, padRight = 25, padTop = 8, padBottom = 30;
  const k = (VIEW_W - padLeft - padRight) / (x1 - x0);
  const tx = padLeft - k * x0;
  const ty = padTop - k * y0;
  const VIEW_H = padTop + k * (y1 - y0) + padBottom;
  // Explicit width/height attributes (not just viewBox + CSS height:auto)
  // — matching the weekly/bar charts, which set these directly via JS
  // rather than leaving the browser to infer height from the aspect
  // ratio. Relying on "auto" intrinsic sizing was the one place this
  // template diverged from the other embeds that never had this bug.
  d3.select('#map-svg')
    .attr('viewBox', `0 0 ${VIEW_W} ${VIEW_H}`)
    .attr('width', VIEW_W)
    .attr('height', VIEW_H);

  function projectPoint(lon, lat) {
    const [x, y] = raw([lon, lat]);
    return [x * k + tx, y * k + ty];
  }

  const projection = d3.geoTransform({
    point(x, y) {
      const [px, py] = projectPoint(x, y);
      this.stream.point(px, py);
    }
  });

  const path = d3.geoPath().projection(projection);
  const maxCases = d3.max(Object.values(caseData), d => Math.max(d.ob1, d.ob2));
  // County shapes are drawn to fill VIEW_W edge-to-edge no matter what
  // VIEW_W actually is (k, above, is chosen specifically to do that) — so a
  // county's on-screen size shrinks right along with a narrower mobile
  // container. Bubble radius was a fixed viewBox-unit constant, though,
  // which does NOT shrink with VIEW_W, so on a narrow phone bubbles stayed
  // desktop-sized while the counties under them shrank — badly out of
  // proportion. sizeFactor scales bubble/dot sizing down with the actual
  // container width (never up past the desktop baseline this was tuned
  // against) so the two stay in proportion at any width.
  const sizeFactor = Math.sqrt(Math.min(1, VIEW_W / 680));
  // Floored so a labeled county's bubble is still large enough to hold its
  // number legibly — otherwise the sqrt scale alone shrinks the smallest
  // labeled counts to a few pixels. Counties below LABEL_MIN don't use this
  // scale at all — they render as a small fixed dot instead (see below).
  const rScaleRaw = d3.scaleSqrt().domain([0, maxCases]).range([0, 34 * sizeFactor]);
  const rScale = v => Math.max(6, 8 * sizeFactor, rScaleRaw(v));

  // Below this many cases, an outbreak's bubble is a small unlabeled dot
  // instead of a numbered bubble — with case counts this high, full bubbles
  // for every single-digit county packed the map too densely to read.
  const LABEL_MIN = 5;
  const DOT_RADIUS = Math.max(1.5, 2 * sizeFactor);

  const svg = d3.select('#map-svg');
  svg.selectAll('*').remove();
  const g   = svg.append('g');

  // Hatch patterns
  const defs = svg.append('defs');
  defs.append('pattern')
    .attr('id', 'hatch-active')
    .attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 6).attr('height', 6)
    .attr('patternTransform', 'rotate(45)')
    .call(p => p.append('rect').attr('width', 6).attr('height', 6).attr('fill', '#f0ddd5'))
    .call(p => p.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6)
      .attr('stroke', '#e0b8a8').attr('stroke-width', 1));
  defs.append('pattern')
    .attr('id', 'hatch-inactive')
    .attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 6).attr('height', 6)
    .attr('patternTransform', 'rotate(45)')
    .call(p => p.append('rect').attr('width', 6).attr('height', 6).attr('fill', '#dedede'))
    .call(p => p.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6)
      .attr('stroke', '#aaaaaa').attr('stroke-width', 1));
  defs.append('pattern')
    .attr('id', 'hatch-transmission')
    .attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 6).attr('height', 6)
    .attr('patternTransform', 'rotate(45)')
    .call(p => p.append('rect').attr('width', 6).attr('height', 6).attr('fill', '#dba99c'))
    .call(p => p.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6)
      .attr('stroke', '#c8886f').attr('stroke-width', 1));

  // Counties
  g.selectAll('.county')
    .data(paCounties.features)
    .join('path')
    .attr('class', d => {
      const name = paFips[d.id];
      let cls;
      if (!name || !caseData[name]) {
        cls = 'county';
      } else {
        cls = isInactive(caseData[name]) ? 'county affected inactive' : 'county affected';
      }
      if (name && TRANSMISSION_COUNTIES.includes(name)) cls += ' transmission';
      return cls;
    })
    .attr('d', path);

  // A per-county stroke on every transmission county draws just as heavy a
  // line between two ADJACENT transmission counties as it does at the true
  // edge of the cluster — the shared internal borders end up just as dark
  // as the outer one, so a contiguous run of counties reads as a uniform
  // grid instead of one highlighted region. Meshing the topology instead
  // keeps only the arcs where membership actually changes (plus any state-
  // edge arcs of a member county), so a single outline traces just the
  // true perimeter of the transmission counties, however many there are or
  // however they're clustered.
  const inTransmissionSet = f => !!f && TRANSMISSION_COUNTIES.includes(paFips[f.id]);
  const transmissionOutline = topojson.mesh(PA_TOPOLOGY, PA_TOPOLOGY.objects.counties, (a, b) => {
    const aIn = inTransmissionSet(a), bIn = inTransmissionSet(b);
    return aIn !== bIn || (a === b && aIn);
  });
  g.append('path')
    .datum(transmissionOutline)
    .attr('d', path)
    .attr('fill', 'none')
    .attr('stroke', '#a93226')
    .attr('stroke-width', 1.5)
    .attr('stroke-linejoin', 'round')
    .attr('pointer-events', 'none');

  // Bubbles + labels
  Object.entries(caseData).forEach(([name, data]) => {
    const feature = paCounties.features.find(f => paFips[f.id] === name);
    if (!feature) return;
    const centroid = path.centroid(feature);
    const outbreaks = [
      { cases: data.ob1, cls: 'inactive' },
      { cases: data.ob2, cls: 'active'   },
    ].sort((a, b) => b.cases - a.cases);

    outbreaks.forEach(ob => {
      if (ob.cases === 0) return;
      const label = ob.cls === 'active' ? 'Current outbreak (since late April)' : 'Prior outbreak (January – March)';
      const r = ob.cases < LABEL_MIN ? DOT_RADIUS : rScale(ob.cases);
      g.append('circle')
        .attr('class', `bubble ${ob.cls}${ob.cases < LABEL_MIN ? ' dot' : ''}`)
        .attr('cx', centroid[0]).attr('cy', centroid[1]).attr('r', r)
        .on('mouseover', e => showTip(e, name, ob.cases, label))
        .on('mousemove', moveTip)
        .on('mouseout', hideTip);
    });

    // Case count labels — restricted to actively-circulating counties (every
    // bubble's size still encodes its own case count; the exact number is
    // only called out where it matters most).
    const labelObs = TRANSMISSION_COUNTIES.includes(name)
      ? outbreaks.filter(o => o.cases >= LABEL_MIN)
      : [];
    labelObs.forEach((ob, i) => {
      const r = rScale(ob.cases);
      let ly = centroid[1];
      if (labelObs.length > 1 && i === 0) {
        const rInner = rScale(labelObs[1].cases);
        ly = centroid[1] - (r + rInner) / 2;
      }
      g.append('text').attr('class', 'case-count-label')
        .attr('x', centroid[0]).attr('y', ly)
        .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
        .attr('font-family', "'Roboto', Arial, sans-serif")
        .attr('font-size', r > 25 ? '14px' : '12px')
        .attr('font-weight', '700').attr('fill', ob.cls === 'active' ? '#7a1a10' : '#444')
        .text(ob.cases);
    });

    // County labels
    const cfg = labelConfig[name];
    if (!cfg) return;
    const maxR = rScale(Math.max(data.ob1, data.ob2, 1));
    let lx = centroid[0] + cfg.dx, ly = centroid[1] + cfg.dy;
    if (cfg.pos === 'above') ly = centroid[1] - maxR - 5;
    if (cfg.pos === 'below') ly = centroid[1] + maxR + 12;
    if (cfg.pos === 'left')  lx = centroid[0] - maxR - 5;
    if (cfg.pos === 'right') lx = centroid[0] + maxR + 5;
    g.append('text').attr('class', 'county-label')
      .attr('x', lx).attr('y', ly).attr('text-anchor', cfg.anchor)
      .attr('dominant-baseline', cfg.pos === 'left' || cfg.pos === 'right' ? 'middle' : 'auto')
      .text(name);
  });

  // City markers
  cities.forEach(city => {
    const [cx, cy] = projectPoint(city.lon, city.lat);
    if (city.star) {
      const starPath = d3.symbol().type(d3.symbolStar).size(40)();
      g.append('path').attr('d', starPath)
        .attr('transform', `translate(${cx},${cy})`)
        .attr('fill', '#555').attr('stroke', '#fff').attr('stroke-width', 0.5);
    } else {
      g.append('circle').attr('class', 'city-dot')
        .attr('cx', cx).attr('cy', cy).attr('r', 3);
    }
    g.append('text').attr('class', 'city-label')
      .attr('x', cx + city.dx).attr('y', cy + city.dy)
      .attr('text-anchor', city.anchor).text(city.name);
  });

}

// Tells the parent frame our true content height, in case it's set up
// to listen (e.g. an iframe-auto-resize script) — a harmless no-op
// otherwise. Without a listener on the host page, the iframe's height
// still has to be set manually to match.
function reportHeight() {
  if (window.parent !== window) {
    window.parent.postMessage(
      { type: 'pg-measles-embed-resize', height: document.querySelector('.dw-chart').getBoundingClientRect().height },
      '*'
    );
  }
}

function drawMap() {
  paCounties = topojson.feature(PA_TOPOLOGY, PA_TOPOLOGY.objects.counties);
  render();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  // A ResizeObserver keeps the parent frame's height in sync with ANY
  // change to the chart's actual size, not just a one-time report right
  // after load — this covers timing races a single postMessage call
  // misses, like a web font finishing its swap (and reflowing text)
  // after the chart's first paint.
  new ResizeObserver(reportHeight).observe(document.querySelector('.dw-chart'));

  // document.fonts.ready resolves once Roboto has actually finished loading
  // and swapped in. ResizeObserver is supposed to catch the resulting
  // text-reflow on its own, but that's an observed gap on some mobile
  // WebKit versions specifically — confirmed in production as a mobile
  // iframe getting stuck short, never growing to the post-font-swap
  // height. This guarantees one more report fires exactly when it's
  // needed, instead of hoping the observer or the timer below catches it.
  if (window.document.fonts && window.document.fonts.ready) {
    window.document.fonts.ready.then(reportHeight);
  }

  // Belt-and-braces on top of the ResizeObserver: re-send the height on
  // a plain timer for the first several seconds after load, the same way
  // production embed libraries (Datawrapper's included) do. This defeats
  // any one-off timing race we haven't diagnosed — mobile Safari's
  // handling of a lazy-loaded iframe's initial layout, in particular —
  // regardless of its exact cause. 30 tries / 500ms = 15s, long enough to
  // outlast a slow mobile connection's web font fetch.
  let reportTries = 0;
  const reportTimer = setInterval(() => {
    reportHeight();
    if (++reportTries >= 30) clearInterval(reportTimer);
  }, 500);
}

drawMap();
</script>
</body>
</html>
