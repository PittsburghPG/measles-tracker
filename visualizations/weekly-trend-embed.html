<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly measles cases in Pennsylvania</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
 * DATAWRAPPER-STYLE TYPOGRAPHY — applies to all visualizations/ embeds.
 * Font: Roboto (fallback Arial/sans-serif). Body/annotation/label text
 * capped at two sizes — 14px primary (near-black), 12px secondary (gray).
 * Regular weight for body text; bold reserved for titles and emphasis.
 * Sentence case throughout.
 */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: #fff; }

  #pg-measles-weekly {
    margin: 0 auto;
    font-family: 'Roboto', Arial, sans-serif;
    padding: 16px 0 12px;
  }
  .pg-weekly-hed {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 6px;
  }
  .pg-weekly-chatter {
    font-size: 14px;
    color: #444;
    line-height: 1.4;
    margin: 0 0 16px;
  }
  .pg-weekly-source {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    line-height: 1.5;
  }
  .pg-weekly-dot {
    font-size: 15px;
    vertical-align: -1px;
    margin: 0 1px;
  }
  #pg-weekly-tip {
    display: none;
    position: fixed;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 8px 12px;
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 14px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    z-index: 100;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="pg-measles-weekly">
  <h2 class="pg-weekly-hed">TK</h2>
  <p class="pg-weekly-chatter">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
  <div style="position:relative">
    <svg id="pg-weekly-svg" style="width:100%;display:block"></svg>
  </div>
  <p class="pg-weekly-source">Chart: Jimmy Cloutier / Post-Gazette <span class="pg-weekly-dot">&bull;</span> Source: Pennsylvania Department of Health. Week beginning dates shown. Most recent week may be incomplete.</p>
</div>

<div id="pg-weekly-tip"></div>

<script>
(function () {
  /* SCRAPER-DATA-START */
  const weeklyData = [
    { week_start: "2026-01-26", new_cases: 5, cumulative_cases: 5 },
    { week_start: "2026-02-02", new_cases: 1, cumulative_cases: 6 },
    { week_start: "2026-02-09", new_cases: 2, cumulative_cases: 8 },
    { week_start: "2026-02-16", new_cases: 0, cumulative_cases: 8 },
    { week_start: "2026-02-23", new_cases: 4, cumulative_cases: 12 },
    { week_start: "2026-03-02", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-03-09", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-03-16", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-03-23", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-03-30", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-04-06", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-04-13", new_cases: 0, cumulative_cases: 12 },
    { week_start: "2026-04-20", new_cases: 1, cumulative_cases: 13 },
    { week_start: "2026-04-27", new_cases: 4, cumulative_cases: 17 },
    { week_start: "2026-05-04", new_cases: 9, cumulative_cases: 26 },
    { week_start: "2026-05-11", new_cases: 4, cumulative_cases: 30 },
    { week_start: "2026-05-18", new_cases: 4, cumulative_cases: 34 },
    { week_start: "2026-05-25", new_cases: 4, cumulative_cases: 38 },
    { week_start: "2026-06-01", new_cases: 22, cumulative_cases: 60 },
    { week_start: "2026-06-08", new_cases: 5, cumulative_cases: 65 },
    { week_start: "2026-06-15", new_cases: 2, cumulative_cases: 67 },
    { week_start: "2026-06-22", new_cases: 17, cumulative_cases: 84 },
    { week_start: "2026-06-29", new_cases: 5, cumulative_cases: 89 },
    { week_start: "2026-07-06", new_cases: 12, cumulative_cases: 101 },
    { week_start: "2026-07-13", new_cases: 9, cumulative_cases: 110 },
    { week_start: "2026-07-20", new_cases: 29, cumulative_cases: 139 },
    { week_start: "2026-07-27", new_cases: 28, cumulative_cases: 167 },
    { week_start: "2026-08-03", new_cases: 59, cumulative_cases: 226 },
    { week_start: "2026-08-10", new_cases: 70, cumulative_cases: 296 },
    { week_start: "2026-08-17", new_cases: 83, cumulative_cases: 379 },
    { week_start: "2026-08-24", new_cases: 81, cumulative_cases: 460 },
    { week_start: "2026-08-31", new_cases: 117, cumulative_cases: 577 },
    { week_start: "2026-09-07", new_cases: 99, cumulative_cases: 676 },
    { week_start: "2026-09-14", new_cases: 91, cumulative_cases: 767 },
    { week_start: "2026-09-21", new_cases: 123, cumulative_cases: 890 }
  ];
  /* SCRAPER-DATA-END */

  const margin = { top: 24, right: 56, bottom: 32, left: 36 };
  const container = document.getElementById('pg-measles-weekly');
  const svgEl = document.getElementById('pg-weekly-svg');
  const tip = document.getElementById('pg-weekly-tip');

  // Flips the tooltip to the left of the cursor when it would otherwise
  // overflow the right edge of the window — position:fixed is relative
  // to the iframe's own viewport when embedded, so an unclamped tooltip
  // gets clipped by the iframe boundary rather than wrapping visibly.
  function positionTip(event) {
    const tipWidth = tip.getBoundingClientRect().width;
    let left = event.clientX + 12;
    if (left + tipWidth > window.innerWidth - 4) {
      left = event.clientX - 12 - tipWidth;
    }
    tip.style.left = left + 'px';
    tip.style.top = (event.clientY - 10) + 'px';
  }

function draw() {
  // Re-measured on every draw (not just once at load) so the chart
  // redraws at true size on resize, instead of the browser uniformly
  // scaling a viewBox frozen at the load-time width — which is what
  // shrinks all the in-chart text when the window narrows afterward.
  const totalW = container.getBoundingClientRect().width || 680;
  const totalH = 220;
  const w = totalW - margin.left - margin.right;
  const h = totalH - margin.top - margin.bottom;

  const svg = d3.select(svgEl);
  svg.selectAll('*').remove();
  svg
    .attr('viewBox', `0 0 ${totalW} ${totalH}`)
    .attr('width', totalW)
    .attr('height', totalH);

  // Soft red fill under the line, fading out toward the x-axis — pure
  // flourish, so it's kept low-opacity enough not to compete with the
  // line/dots as the chart's primary read.
  const gradient = svg.append('defs').append('linearGradient')
    .attr('id', 'pg-weekly-area-gradient')
    .attr('x1', '0').attr('y1', '0').attr('x2', '0').attr('y2', '1');
  gradient.append('stop').attr('offset', '0%').attr('stop-color', '#a93226').attr('stop-opacity', 0.32);
  gradient.append('stop').attr('offset', '100%').attr('stop-color', '#a93226').attr('stop-opacity', 0.02);

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // x-axis is a real time scale (not a category band) so weeks with no
  // data show up as empty space instead of being squeezed out.
  const parseWeek = s => new Date(s + 'T12:00:00Z');
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const weekDates = weeklyData.map(d => parseWeek(d.week_start));
  const domainStart = new Date(d3.min(weekDates).getTime() - msPerWeek * 0.5);
  const domainEnd   = new Date(d3.max(weekDates).getTime() + msPerWeek * 0.5);

  const x = d3.scaleTime().domain([domainStart, domainEnd]).range([0, w]);

  const centerX = d => x(parseWeek(d.week_start));

  const maxY = d3.max(weeklyData, d => d.cumulative_cases);
  const y = d3.scaleLinear().domain([0, Math.ceil(maxY * 1.12)]).range([h, 0]);

  // Grid + y-axis
  g.append('g').call(d3.axisLeft(y).ticks(4))
    .call(ax => ax.select('.domain').remove())
    .call(ax => ax.selectAll('line').attr('stroke', '#eee').attr('stroke-dasharray', '2,2').attr('x2', w))
    .call(ax => ax.selectAll('text').attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px').attr('fill', '#888'));

  // "Jan 26" style formatter — still used for tooltips, even though the
  // axis itself now shows month names rather than individual dates.
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtWeek = d => `${months[d.getUTCMonth()]} ${d.getUTCDate()}`;

  // x-axis: AP-style month labels — abbreviated for longer names (Jan,
  // Feb), spelled out for short ones (March, April, May, June, July) —
  // each centered under its own month's span, plus small unlabeled tick
  // marks at each week for visual rhythm. Matches the newsroom's standard
  // axis style rather than labeling individual dates.
  const apMonths = ['Jan','Feb','March','April','May','June','July','Aug','Sept','Oct','Nov','Dec'];

  // Minor weekly tick marks — no text, just a short mark per week.
  g.append('g').attr('transform', `translate(0,${h})`)
    .call(d3.axisBottom(x).tickValues(weekDates).tickFormat('').tickSize(5))
    .call(ax => ax.select('.domain').attr('stroke', '#ccc'))
    .call(ax => ax.selectAll('line').attr('stroke', '#ccc'));

  // Major month labels, centered on each month's span as clipped to the
  // visible domain — independent of any single tick position, so a
  // partial first/last month still centers correctly within its
  // (shorter) visible slice. Month *boundaries* (the transitions between
  // consecutive months, not the very first/last edge) get a taller
  // divider line than the weekly ticks, to visually separate months —
  // matching the reference chart's look.
  // A raw calendar month-start rarely lines up with a week boundary, so
  // each divider is placed at the midpoint between the two weeks it falls
  // between, keeping it clear of the weekly tick marks.
  const boundaryBetweenWeeks = target => {
    for (let i = 0; i < weekDates.length - 1; i++) {
      if (weekDates[i] <= target && target < weekDates[i + 1]) {
        return new Date((weekDates[i].getTime() + weekDates[i + 1].getTime()) / 2);
      }
    }
    return target < weekDates[0] ? weekDates[0] : weekDates[weekDates.length - 1];
  };

  const monthList = [];
  const monthBoundaries = [];
  let curMonth = new Date(Date.UTC(domainStart.getUTCFullYear(), domainStart.getUTCMonth(), 1));
  let isFirstMonth = true;
  while (curMonth < domainEnd) {
    if (!isFirstMonth) monthBoundaries.push(boundaryBetweenWeeks(curMonth));
    isFirstMonth = false;
    monthList.push(curMonth.getUTCMonth());
    curMonth = new Date(Date.UTC(curMonth.getUTCFullYear(), curMonth.getUTCMonth() + 1, 1));
  }

  // Each month's label centers between the same divider lines drawn below
  // (week-midpoint boundaries), not the raw calendar month edges — those
  // rarely match, and centering on the calendar edges was pushing a
  // partial first/last month's label visibly off from its own span.
  const monthEdges = [domainStart, ...monthBoundaries, domainEnd];
  const monthSpans = monthList.map((month, i) => ({
    month,
    center: new Date((monthEdges[i].getTime() + monthEdges[i + 1].getTime()) / 2)
  }));

  g.selectAll('.month-boundary').data(monthBoundaries).join('line')
    .attr('class', 'month-boundary')
    .attr('x1', d => x(d)).attr('x2', d => x(d))
    .attr('y1', h).attr('y2', h + 18)
    .attr('stroke', '#ccc');

  const monthLabels = g.selectAll('.month-label').data(monthSpans).join('text')
    .attr('class', 'month-label')
    .attr('x', d => x(d.center))
    .attr('y', h + 22)
    .attr('text-anchor', 'middle')
    .attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px').attr('fill', '#888')
    .text(d => apMonths[d.month]);

  // Safety pass: drop a month label if it would still collide with a
  // kept neighbor (rare with ~4 weeks between months, but a narrow
  // embed could squeeze two adjacent short months together). First and
  // last are always kept.
  const monthNodes = monthLabels.nodes();
  if (monthNodes.length > 0) {
    const keep = new Set([0, monthNodes.length - 1]);
    let lastRight = monthNodes[0].getBBox().x + monthNodes[0].getBBox().width;
    for (let i = 1; i < monthNodes.length - 1; i++) {
      const bbox = monthNodes[i].getBBox();
      if (bbox.x > lastRight + 4) {
        keep.add(i);
        lastRight = bbox.x + bbox.width;
      }
    }
    const lastBBox = monthNodes[monthNodes.length - 1].getBBox();
    for (let i = monthNodes.length - 2; i > 0; i--) {
      if (!keep.has(i)) continue;
      const bbox = monthNodes[i].getBBox();
      if (bbox.x + bbox.width > lastBBox.x - 4) {
        keep.delete(i);
      } else {
        break;
      }
    }
    monthNodes.forEach((node, i) => { if (!keep.has(i)) d3.select(node).remove(); });
  }

  // Area fill under the cumulative line, down to the x-axis.
  const area = d3.area()
    .x(centerX)
    .y0(h)
    .y1(d => y(d.cumulative_cases))
    .curve(d3.curveMonotoneX);

  g.append('path').datum(weeklyData)
    .attr('fill', 'url(#pg-weekly-area-gradient)')
    .attr('d', area);

  // Cumulative line
  const line = d3.line()
    .x(centerX)
    .y(d => y(d.cumulative_cases))
    .curve(d3.curveMonotoneX);

  g.append('path').datum(weeklyData)
    .attr('fill', 'none').attr('stroke', '#a93226').attr('stroke-width', 2)
    .attr('d', line);

  // Dots on cumulative line
  g.selectAll('.wdot').data(weeklyData).join('circle')
    .attr('class', 'wdot')
    .attr('cx', centerX)
    .attr('cy', d => y(d.cumulative_cases))
    .attr('r', 3).attr('fill', '#a93226');

  // Larger invisible hit targets on the dots — a 3px dot is too small to
  // hover reliably, so the tooltip trigger is an 8px transparent circle
  // centered on the same point.
  g.selectAll('.wdot-hit').data(weeklyData).join('circle')
    .attr('class', 'wdot-hit')
    .attr('cx', centerX)
    .attr('cy', d => y(d.cumulative_cases))
    .attr('r', 8).attr('fill', 'transparent')
    .style('cursor', 'pointer')
    .on('mouseover', function (event, d) {
      tip.innerHTML = `<strong>Week of ${fmtWeek(parseWeek(d.week_start))}</strong><br>${d.new_cases} case${d.new_cases !== 1 ? 's' : ''} reported<br>${d.cumulative_cases} cumulative`;
      tip.style.display = 'block';
      positionTip(event);
    })
    .on('mousemove', positionTip)
    .on('mouseout', function () {
      tip.style.display = 'none';
    });

  // Final cumulative label
  const last = weeklyData[weeklyData.length - 1];
  g.append('text')
    .attr('x', centerX(last) + 6)
    .attr('y', y(last.cumulative_cases) + 4)
    .attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px')
    .attr('font-weight', '700').attr('fill', '#a93226')
    .text(last.cumulative_cases);

  // Legend — aligned to x=0 (the SVG's left edge), matching the head/chatter
  // text above it, rather than the plot area's margin.left inset.
  const legend = svg.append('g').attr('transform', 'translate(0, 6)');
  legend.append('line').attr('x1', 0).attr('x2', 12).attr('y1', 6).attr('y2', 6).attr('stroke', '#a93226').attr('stroke-width', 2);
  legend.append('circle').attr('cx', 6).attr('cy', 6).attr('r', 3).attr('fill', '#a93226');
  legend.append('text').attr('x', 16).attr('y', 10).attr('font-family', "'Roboto', Arial, sans-serif").attr('font-size', '12px').attr('fill', '#555').text('Cumulative cases');
}

// Tells the parent frame our true content height, in case it's set up
// to listen (e.g. an iframe-auto-resize script) — a harmless no-op
// otherwise. Without a listener on the host page, the iframe's height
// still has to be set manually to match.
function reportHeight() {
  if (window.parent !== window) {
    window.parent.postMessage(
      { type: 'pg-measles-embed-resize', height: container.getBoundingClientRect().height },
      '*'
    );
  }
}

draw();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 150);
});

// A ResizeObserver keeps the parent frame's height in sync with ANY
// change to the chart's actual size, not just a one-time report right
// after load — this covers timing races a single postMessage call
// misses, like a web font finishing its swap (and reflowing text)
// after the chart's first paint.
new ResizeObserver(reportHeight).observe(container);

// document.fonts.ready resolves once Roboto has actually finished loading
// and swapped in. ResizeObserver is supposed to catch the resulting
// text-reflow on its own, but that's an observed gap on some mobile
// WebKit versions specifically — confirmed in production as a mobile
// iframe getting stuck short, never growing to the post-font-swap height.
// This guarantees one more report fires exactly when it's needed, instead
// of hoping the observer or the timer below catches it.
if (window.document.fonts && window.document.fonts.ready) {
  window.document.fonts.ready.then(reportHeight);
}

// Belt-and-braces on top of the ResizeObserver: re-send the height on a
// plain timer for the first several seconds after load, the same way
// production embed libraries (Datawrapper's included) do — a backstop
// against any timing race regardless of its exact cause. 30 tries / 500ms
// = 15s, long enough to outlast a slow mobile connection's web font fetch.
let reportTries = 0;
const reportTimer = setInterval(() => {
  reportHeight();
  if (++reportTries >= 30) clearInterval(reportTimer);
}, 500);
})();
</script>
</body>
</html>
