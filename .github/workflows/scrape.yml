name: Scrape

on:
  schedule:
    - cron: '5 21 * * *'  # 5:05pm ET daily (data typically published Tue/Thu)
  workflow_dispatch:            # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('httr2','rvest','dplyr','readr','stringr','jsonlite'), repos='https://cloud.r-project.org')"

      - name: Run scraper
        run: Rscript scraper/measles_scraper.R

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/measles_daily.tsv data/measles_weekly.tsv visualizations/*.html
          git diff --cached --quiet || git commit -m "Auto-update data: $(date -u '+%Y-%m-%d')"
          git push
