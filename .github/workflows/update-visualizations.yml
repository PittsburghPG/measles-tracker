name: Update visualizations

on:
  workflow_dispatch:            # manual trigger from GitHub UI; schedule TBD

jobs:
  update-visualizations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('dplyr','readr','stringr'), repos='https://cloud.r-project.org')"

      - name: Update embeds
        run: Rscript visualizations/update_visualizations.R

      - name: Commit updated embeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visualizations/*.html
          git diff --cached --quiet || git commit -m "Auto-update visualizations: $(date -u '+%Y-%m-%d')"
          git push
